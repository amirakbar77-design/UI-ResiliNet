<title>Solution Methodology Visual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --page: #EEF2F6; --paper: #FFFFFF; --ink: #111827; --muted: #5B6B7D; --rule: #D6DEE7;
    --c1: #7A4BE0; --c2: #5A35B0; --c3: #E8467C; --c4: #F5852A; --c5: #E9B824;
    --water: #7FB6EA; --deep: #4F8FD6; --shallow: #A9D0F2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; padding-block: 28px 48px; padding-inline: clamp(16px, 3vw, 40px); }
  .stage { max-width: 1600px; margin: 0 auto; background: var(--paper); border-radius: 8px; box-shadow: 0 20px 50px -30px rgba(15,27,45,.4), 0 1px 3px rgba(15,27,45,.08); overflow: hidden; }
  svg { display: block; width: 100%; height: auto; }
  .note { max-width: 1600px; margin: 14px auto 0; color: var(--muted); font-size: 13px; font-family: "IBM Plex Mono", ui-monospace, monospace; display: flex; gap: 18px; flex-wrap: wrap; }
  text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  @media (prefers-reduced-motion: no-preference) {
    .drop { animation: fall 1.1s linear infinite; }
    @keyframes fall { from { transform: translateY(0); opacity: .9; } to { transform: translateY(46px); opacity: 0; } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  }
</style>

<div class="stage"><svg id="scene" viewBox="0 0 1600 900" role="img" aria-label="Solution methodology: an isometric valley in the centre with terrain, river, roads, houses, towers, a rain cloud and a river gauge; three callouts on the left (data input, data preparation, GeoAI analysis) and two on the right (prototype output, validation) each point to the part of the scene they produce."></svg></div>
<p class="note"><span>1600 × 900 · screenshot the white card straight into the slide</span><span>colours follow the five badges on the methodology slide</span></p>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('scene');
  const el = (name, attrs = {}, parent = svg) => {
    const node = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    parent.appendChild(node);
    return node;
  };
  const text = (x, y, str, attrs = {}, parent = svg) => {
    const t = el('text', { x, y, ...attrs }, parent);
    t.textContent = str;
    return t;
  };
  const C = { c1: '#7A4BE0', c2: '#5A35B0', c3: '#E8467C', c4: '#F5852A', c5: '#E9B824', ink: '#111827', muted: '#5B6B7D' };
  const DEEP = { '#7A4BE0': '#5B2FBF', '#5A35B0': '#3B1F7A', '#E8467C': '#BC1750', '#F5852A': '#B4570B', '#E9B824': '#8A6406' };

  // ---------- heightfield ---------------------------------------------------
  const N = 24;
  const gauss = (x, y, cx, cy, a, s) => a * Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / s);
  const riverX = (y) => 13 + 2.2 * Math.sin(y / 3.5);
  const height = (x, y) => {
    let h = 0.55;
    h += gauss(x, y, 5, 3, 3.4, 16) + gauss(x, y, 10, 1.5, 2.4, 9) + gauss(x, y, 1, 9, 1.6, 7);
    h += gauss(x, y, 19.5, 4, 3.1, 13) + gauss(x, y, 24, 9, 1.4, 6);
    h += gauss(x, y, 6, 14, 2.1, 7);                 // Bukit Bedak, the candidate hill
    h += gauss(x, y, 22, 20, 1.2, 8);
    const d = x - riverX(y);
    h -= 1.55 * Math.exp(-(d * d) / 5.5);           // the river valley
    return Math.max(-0.7, h);
  };
  const WATER = 0.05, FLOOD = 0.36;
  const ground = (x, y) => Math.max(height(x, y), FLOOD);

  // ---------- projection -------------------------------------------------------
  const OX = 800, OY = 236, SX = 21, SY = 10.5, SZ = 18;
  const P = (x, y, z) => [OX + (x - y) * SX, OY + (x + y) * SY - z * SZ];
  const pts = (arr) => arr.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');

  const shade = (hex, k) => {
    const n = parseInt(hex.slice(1), 16);
    const f = (c) => Math.max(0, Math.min(255, Math.round(c * k)));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  };
  const landColor = (h) => (h < 0.9 ? '#BFE3A6' : h < 1.7 ? '#98D07F' : h < 2.6 ? '#72B766' : '#529C58');

  const terrain = el('g', { id: 'terrain' });
  const gridLayer = el('g', { id: 'grid', opacity: '0.22' });
  // back to front
  const cells = [];
  for (let x = 0; x < N; x += 1) for (let y = 0; y < N; y += 1) cells.push([x, y]);
  cells.sort((a, b) => a[0] + a[1] - (b[0] + b[1]));
  for (const [x, y] of cells) {
    const corners = [[x, y], [x + 1, y], [x + 1, y + 1], [x, y + 1]];
    const hs = corners.map(([cx, cy]) => height(cx, cy));
    const mean = hs.reduce((a, b) => a + b, 0) / 4;
    const flooded = mean < FLOOD;
    const zs = flooded ? hs.map(() => FLOOD) : hs;
    const top = corners.map(([cx, cy], i) => P(cx, cy, zs[i]));
    const base = flooded ? (mean < WATER ? '#4F8FD6' : mean < FLOOD - 0.18 ? '#7FB6EA' : '#A9D0F2') : landColor(mean);
    // side faces (front-right and front-left), only where they can show
    const floor = -1.4;
    el('polygon', { points: pts([P(x + 1, y, zs[1]), P(x + 1, y + 1, zs[2]), P(x + 1, y + 1, floor), P(x + 1, y, floor)]), fill: shade(base, 0.72) }, terrain);
    el('polygon', { points: pts([P(x, y + 1, zs[3]), P(x + 1, y + 1, zs[2]), P(x + 1, y + 1, floor), P(x, y + 1, floor)]), fill: shade(base, 0.84) }, terrain);
    el('polygon', { points: pts(top), fill: base }, terrain);
    if (!flooded) el('polygon', { points: pts(top), fill: 'none', stroke: '#ffffff', 'stroke-width': '0.6' }, gridLayer);
  }
  svg.appendChild(gridLayer);

  // ---------- helpers on the ground -------------------------------------------
  const lift = 0.06;
  const pathOn = (gridPts, z = lift) => gridPts.map(([x, y]) => P(x, y, ground(x, y) + z));
  const smooth = (points) => {
    // Catmull-Rom through screen points
    let d = `M${points[0][0]},${points[0][1]}`;
    for (let i = 0; i < points.length - 1; i += 1) {
      const p0 = points[Math.max(0, i - 1)], p1 = points[i], p2 = points[i + 1], p3 = points[Math.min(points.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  };
  const dense = (gridPts, steps = 6) => {
    const out = [];
    for (let i = 0; i < gridPts.length - 1; i += 1) {
      for (let s = 0; s < steps; s += 1) {
        const t = s / steps;
        out.push([gridPts[i][0] + (gridPts[i + 1][0] - gridPts[i][0]) * t, gridPts[i][1] + (gridPts[i + 1][1] - gridPts[i][1]) * t]);
      }
    }
    out.push(gridPts[gridPts.length - 1]);
    return out;
  };

  // ---------- roads ---------------------------------------------------------------
  const roadA = dense([[1.5, 21.5], [4.5, 19.5], [7.5, 17.5], [9.5, 16.2], [12.5, 14.6], [15.5, 12.5], [18, 9.5], [19.3, 6.5], [19.6, 4.6]], 5);
  const roadB = dense([[4.5, 19.5], [4.2, 16.8], [5.3, 14.8], [6.2, 13.9]], 5);
  const drawRoad = (grid, color, width) => {
    const d = smooth(pathOn(grid));
    el('path', { d, fill: 'none', stroke: shade('#8B95A5', 0.75), 'stroke-width': width + 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    el('path', { d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    return d;
  };
  const dA = drawRoad(roadA, '#E5E9EF', 7);
  const dB = drawRoad(roadB, '#E5E9EF', 6);
  el('path', { d: dA, fill: 'none', stroke: '#ffffff', 'stroke-width': '1.4', 'stroke-dasharray': '6 6', opacity: '0.9' });
  // the route wave: green to the bridge, red where the crossing closes, amber beyond
  const seg = (grid, from, to) => pathOn(grid.slice(from, to + 1));
  const idxBridge = roadA.findIndex(([x, y]) => x >= 11.2);
  el('path', { d: smooth(seg(roadA, 0, idxBridge - 1)), fill: 'none', stroke: '#2F9E6A', 'stroke-width': '3.2', 'stroke-linecap': 'round', class: 'pulse' });
  el('path', { d: smooth(pathOn(roadB)), fill: 'none', stroke: '#2F9E6A', 'stroke-width': '3.2', 'stroke-linecap': 'round', class: 'pulse' });
  el('path', { d: smooth(seg(roadA, idxBridge + 3, roadA.length - 1)), fill: 'none', stroke: '#D89A1C', 'stroke-width': '3.2', 'stroke-linecap': 'round', opacity: '0.9' });
  // bridge deck over the river
  const bridgeMid = pathOn([[11.4, 15.2]], 0.12)[0];
  el('rect', { x: bridgeMid[0] - 26, y: bridgeMid[1] - 6, width: 52, height: 12, rx: 3, fill: '#6B7280', transform: `rotate(-28 ${bridgeMid[0]} ${bridgeMid[1]})` });
  // the crossing that closes
  const [cx, cy] = P(11.4, 15.2, ground(11.4, 15.2) + 0.9);
  el('circle', { cx, cy, r: 13, fill: '#C2392F' });
  el('path', { d: `M${cx - 5},${cy - 5} L${cx + 5},${cy + 5} M${cx + 5},${cy - 5} L${cx - 5},${cy + 5}`, stroke: '#fff', 'stroke-width': '2.6', 'stroke-linecap': 'round' });

  // ---------- houses ---------------------------------------------------------------
  const house = (x, y, roof = '#E76F51', flooded = false) => {
    const z0 = ground(x, y) + 0.02, s = 0.42, hgt = flooded ? 0.22 : 0.38;
    const g = el('g');
    const wallR = [P(x + s, y, z0), P(x + s, y + s, z0), P(x + s, y + s, z0 + hgt), P(x + s, y, z0 + hgt)];
    const wallF = [P(x, y + s, z0), P(x + s, y + s, z0), P(x + s, y + s, z0 + hgt), P(x, y + s, z0 + hgt)];
    el('polygon', { points: pts(wallR), fill: '#D9DEE7' }, g);
    el('polygon', { points: pts(wallF), fill: '#F3F5F8' }, g);
    // roof: a gabled top drawn as two faces
    const ridgeA = P(x + s / 2, y, z0 + hgt + 0.22), ridgeB = P(x + s / 2, y + s, z0 + hgt + 0.22);
    el('polygon', { points: pts([P(x, y, z0 + hgt), ridgeA, ridgeB, P(x, y + s, z0 + hgt)]), fill: shade(roof, 0.85) }, g);
    el('polygon', { points: pts([P(x + s, y, z0 + hgt), ridgeA, ridgeB, P(x + s, y + s, z0 + hgt)]), fill: roof }, g);
    return g;
  };
  const rnd = (seed) => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const r = rnd(20141223);
  const town = [];
  for (let i = 0; i < 16; i += 1) town.push([14.2 + r() * 3.8, 15.8 + r() * 3.4]);
  for (let i = 0; i < 5; i += 1) town.push([19.2 + r() * 2, 9 + r() * 1.8]);
  town.sort((a, b) => a[0] + a[1] - (b[0] + b[1]));
  for (const [x, y] of town) {
    const flooded = height(x, y) < FLOOD;
    house(x, y, flooded ? '#B85C4B' : (r() > 0.5 ? '#E76F51' : '#EFA251'), flooded);
  }

  // ---------- towers -------------------------------------------------------------
  const mast = (x, y, h, color, id) => {
    const z0 = ground(x, y);
    const [bx, by] = P(x, y, z0), [tx, ty] = P(x, y, z0 + h);
    const g = el('g', { id });
    el('line', { x1: bx - 7, y1: by, x2: tx, y2: ty, stroke: color, 'stroke-width': '3' }, g);
    el('line', { x1: bx + 7, y1: by, x2: tx, y2: ty, stroke: color, 'stroke-width': '3' }, g);
    for (let i = 1; i <= 3; i += 1) {
      const t = i / 4, w = 7 * (1 - t);
      const yy = by + (ty - by) * t, xx = bx + (tx - bx) * t;
      el('line', { x1: xx - w, y1: yy, x2: xx + w, y2: yy, stroke: color, 'stroke-width': '2' }, g);
    }
    el('circle', { cx: tx, cy: ty, r: 5, fill: color }, g);
    return [tx, ty];
  };
  // coverage rings and the fan on the ground plane
  const ring = (x, y, rad, stroke, fill, dash) => {
    const p = [];
    for (let a = 0; a <= 64; a += 1) {
      const t = (a / 64) * Math.PI * 2;
      const gx = x + Math.cos(t) * rad, gy = y + Math.sin(t) * rad;
      p.push(P(gx, gy, ground(gx, gy) + 0.08));
    }
    el('path', { d: smooth(p), fill, stroke, 'stroke-width': '1.8', 'stroke-dasharray': dash ?? 'none', opacity: '0.95' });
  };
  ring(6.2, 13.9, 4.0, '#2F9E6A', 'rgba(47,158,106,0.14)');
  ring(19.6, 4.6, 4.6, C.c4, 'rgba(245,133,42,0.14)');
  const topExisting = mast(6.2, 13.9, 2.0, '#2F9E6A', 'site');
  const topCandidate = mast(19.6, 4.6, 2.3, C.c4, 'portable');


  // depot truck
  {
    const [x, y] = [1.5, 21.5];
    const z0 = ground(x, y) + 0.02;
    el('polygon', { points: pts([P(x, y, z0), P(x + 0.9, y, z0), P(x + 0.9, y, z0 + 0.5), P(x, y, z0 + 0.5)]), fill: '#F5852A' });
    el('polygon', { points: pts([P(x + 0.9, y, z0), P(x + 0.9, y + 0.5, z0), P(x + 0.9, y + 0.5, z0 + 0.5), P(x + 0.9, y, z0 + 0.5)]), fill: shade('#F5852A', 0.75) });
    el('polygon', { points: pts([P(x, y, z0 + 0.5), P(x + 0.9, y, z0 + 0.5), P(x + 0.9, y + 0.5, z0 + 0.5), P(x, y + 0.5, z0 + 0.5)]), fill: '#FFD9B8' });
  }

  // ---------- gauge ------------------------------------------------------------------
  {
    const [x, y] = [14.67, 8];
    const z0 = ground(x, y) - 0.15;
    const [bx, by] = P(x, y, z0), [tx, ty] = P(x, y, z0 + 2.1);
    const g = el('g');
    el('rect', { x: bx - 11, y: ty, width: 22, height: by - ty, rx: 3, fill: '#FFFFFF', stroke: '#111827', 'stroke-width': '2.4' }, g);
    for (let i = 1; i < 10; i += 1) {
      const yy = ty + (by - ty) * (i / 10);
      el('line', { x1: bx - 11, y1: yy, x2: bx - 11 + (i % 5 === 0 ? 14 : 7), y2: yy, stroke: '#111827', 'stroke-width': '1.8' }, g);
    }
    const yd = ty + (by - ty) * 0.46;              // 25 m danger level
    el('line', { x1: bx - 16, y1: yd, x2: bx + 16, y2: yd, stroke: '#C2392F', 'stroke-width': '3.4', 'stroke-linecap': 'round' }, g);
    const yn = ty + (by - ty) * 0.3;               // today's 27.0 m reading
    el('line', { x1: bx - 16, y1: yn, x2: bx + 16, y2: yn, stroke: '#1D4ED8', 'stroke-width': '3.4', 'stroke-linecap': 'round' }, g);
    el('circle', { cx: bx + 16, cy: yn, r: 4, fill: '#1D4ED8' }, g);
  }

  // ---------- rain cloud --------------------------------------------------------------
  {
    const [cx0, cy0] = P(2, 8, 6.6);
    const g = el('g');
    for (const [dx, dy, rr] of [[-46, 8, 26], [-14, -8, 34], [26, 0, 30], [56, 12, 22], [10, 16, 26]]) el('circle', { cx: cx0 + dx, cy: cy0 + dy, r: rr, fill: '#DCE4EE' }, g);
    el('rect', { x: cx0 - 70, y: cy0 + 8, width: 150, height: 26, rx: 13, fill: '#DCE4EE' }, g);
    for (let i = 0; i < 9; i += 1) {
      const x = cx0 - 56 + i * 15;
      const d = el('line', { x1: x, y1: cy0 + 40, x2: x - 6, y2: cy0 + 56, stroke: '#4F8FD6', 'stroke-width': '2.2', 'stroke-linecap': 'round', class: 'drop' }, g);
      d.style.animationDelay = `${(i * 0.13) % 1.1}s`;
    }
  }

  // ---------- tags on the scene ------------------------------------------------------------
  const tag = (x, y, label, color, anchorAbove = true, shift = 0) => {
    const g = el('g');
    const w = label.length * 7.15 + 28, h = 20;
    const bx = x + shift - w / 2, by = anchorAbove ? y - h - 20 : y + 20;
    el('line', { x1: x, y1: y, x2: x + shift, y2: anchorAbove ? by + h : by, stroke: color, 'stroke-width': '1.6' }, g);
    el('circle', { cx: x, cy: y, r: 3, fill: color }, g);
    el('rect', { x: bx, y: by, width: w, height: h, rx: 10, fill: '#ffffff', stroke: color, 'stroke-width': '1.4' }, g);
    el('circle', { cx: bx + 11, cy: by + 10, r: 4.5, fill: color }, g);
    text(bx + 21, by + 14, label, { 'font-size': '11.5', fill: C.ink, class: 'mono' }, g);
  };
  const at = (x, y, z = 0) => P(x, y, ground(x, y) + z);
  { const [x, y] = P(2, 8, 6.6); tag(x + 14, y - 46, 'WeatherNext 3 · rain forecast', C.c1); }
  tag(...at(14.67, 8, 2.05), 'gauge 27.0 m', C.c1);
  tag(cx, cy - 10, 'crossing closes', C.c3);
  tag(topCandidate[0], topCandidate[1] - 8, 'portable tower', C.c4, true, -70);

  // ---------- title and the five callouts ---------------------------------------------------
  const items = [
    ['Data Input', 'NASA SRTM · Sentinel-2 · OpenStreetMap · WorldPop · JPS InfoBanjir · WeatherNext 3', C.c1, 'left', 200, [P(2, 8, 6.6)[0] - 74, P(2, 8, 6.6)[1] + 8]],
    ['Data Preparation', '62 m terrain grid · HAND flood surface · junction-preserving road graph', C.c2, 'left', 430, at(8.3, 20.3, 0.1)],
    ['GeoAI / Analysis', 'AI rain → river level · roads close hour by hour · Dijkstra reach · viewshed ranks hills', C.c3, 'left', 660, [cx - 14, cy + 1]],
    ['Prototype Output', 'Interactive 3D app: flood, road closures, failing sites, a ranked tower with coordinates', C.c4, 'right', 330, [topCandidate[0] + 7, topCandidate[1] + 1]],
    ['Validation', 'December 2014 replayed against the record, misses reported · re-run on a second valley in Sabah', C.c5, 'right', 580, [at(14.67, 8, 0.9)[0] + 13, at(14.67, 8, 0.9)[1]]],
  ];
  const wrap = (body, max) => {
    const lines = [''];
    for (const w of body.split(' ')) {
      if ((lines[lines.length - 1] + ' ' + w).trim().length > max) lines.push(w);
      else lines[lines.length - 1] = (lines[lines.length - 1] + ' ' + w).trim();
    }
    return lines;
  };
  for (const [title, body, color, side, y, anchor] of items) {
    const g = el('g');
    const left = side === 'left';
    const bx = left ? 92 : 1268;
    const tx = bx + 42;
    el('circle', { cx: bx, cy: y, r: 24, fill: color }, g);
    el('path', { d: `M${bx - 10},${y} l7,7 l13,-14`, fill: 'none', stroke: '#fff', 'stroke-width': '3.5', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    text(tx, y - 6, title, { 'font-size': '21', 'font-weight': '700', fill: C.ink }, g);
    wrap(body, 30).forEach((ln, k) => text(tx, y + 18 + k * 20, ln, { 'font-size': '15', fill: C.muted }, g));
    // one thick dotted leader per point, from the column edge to the thing it makes
    const [ax, ay] = anchor;
    const x0 = left ? 380 : 1240;
    const mx = x0 + (ax - x0) * 0.55;
    const line = DEEP[color] ?? color;
    const dir = left ? 1 : -1;                // the arrow points into the scene
    const endX = ax - dir * 11;
    const d = `M${x0},${y} C${mx},${y} ${mx},${ay} ${endX},${ay}`;
    el('path', { d, fill: 'none', stroke: '#ffffff', 'stroke-width': '8', 'stroke-linecap': 'round', opacity: '0.9' }, g);
    el('path', { d, fill: 'none', stroke: line, 'stroke-width': '3', 'stroke-linecap': 'round' }, g);
    el('circle', { cx: x0, cy: y, r: 4.5, fill: line }, g);
    el('polygon', {
      points: `${ax},${ay} ${ax - dir * 13},${ay - 6.5} ${ax - dir * 13},${ay + 6.5}`,
      fill: line, stroke: '#ffffff', 'stroke-width': '3', 'stroke-linejoin': 'round', 'paint-order': 'stroke',
    }, g);
  }
  // legend
  text(64, 858, 'Roads: green stays open · amber closes before the peak · the red crossing closes first.', { 'font-size': '13', fill: C.muted });
})();
</script>
